[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

# -------------------------
# HTTP input (Fluent Bit 2.x)
# -------------------------
[INPUT]
    Name   http
    Listen 0.0.0.0
    Port   9000
    Tag    http.json
    tag_key tag

# -------------------------
# UDP CSV input
# -------------------------
[INPUT]
    Name   udp
    Listen 0.0.0.0
    Port   9001
    Tag    udp.csv
    Buffer_Size 64k

# -------------------------
# Parse HTTP JSON body
# -------------------------
[FILTER]
    Name    parser
    Match   http.json
    Key_Name body
    Parser  json_parser

# -------------------------
# Parse UDP CSV
# -------------------------
[FILTER]
    Name    parser
    Match   udp.csv
    Key_Name log
    Parser  csv_parser

# -------------------------
# Loki output
# -------------------------
[OUTPUT]
    Name   loki
    Match  *
    Host   loki
    Port   3100
    Labels job=ios,transport=$TAG
    Line_Format json

