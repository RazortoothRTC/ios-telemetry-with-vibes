[SERVICE]
    Flush        1
    Log_Level    info

# -------------------------
# HTTP JSON input (existing)
# -------------------------
[INPUT]
    Name   http
    Listen 0.0.0.0
    Port   9000
    Format json
    Tag    http.json

# -------------------------
# UDP CSV input (new)
# -------------------------
[INPUT]
    Name   udp
    Listen 0.0.0.0
    Port   9001
    Tag    udp.csv

# -------------------------
# CSV parser
# -------------------------
[PARSER]
    Name        csv_parser
    Format      csv
    Separator   ,
    Columns     timestamp,counter,message

# -------------------------
# Apply CSV parser
# -------------------------
[FILTER]
    Name    parser
    Match   udp.csv
    Key_Name log
    Parser  csv_parser

# -------------------------
# Loki output
# -------------------------
[OUTPUT]
    Name   loki
    Match  *
    Host   loki
    Port   3100
    Labels job=ios,transport=$TAG
    Line_Format json

